# Drop-in for systemd-networkd-wait-online.service.
# Netplan only makes the boot wait for wired interfaces, never for WiFi, so
# network-online.target (and Docker after it) would be reached before WiFi is up.
# Wait for wifi0 instead, at most 60 s.
[Unit]
# Reset netplan's condition (it skips this unit when no wired interface is required).
ConditionPathIsSymbolicLink=

[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --interface=wifi0:routable --timeout=60
