# smartd (smartmontools) disk health monitoring for all disks.
# -a                         monitor health, attributes, error and self-test logs
# -n standby,q               don't wake a sleeping disk just to poll it
# -s (S/../.././02|L/../../6/03)  short self-test daily 02:00, long self-test Saturday 03:00
# -W 4,45,55                 log temperature changes of 4 C, warn at 45 C, critical at 55 C
# Problems are logged to the journal: journalctl -u smartmontools
DEVICESCAN -a -n standby,q -s (S/../.././02|L/../../6/03) -W 4,45,55
